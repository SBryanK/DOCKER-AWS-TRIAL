name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t policy-rag:ci .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test client
        run: pip install httpx
      - name: Start container with sample corpus
        run: |
          docker run -d --name api -p 8000:8000 \
            -v "$PWD/data/policies:/data/policies:ro" policy-rag:ci
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
      - name: Functional API tests (29 checks)
        run: python -m scripts.functional_test --base-url http://localhost:8000
      - name: Container logs on failure
        if: failure()
        run: docker logs api
      - name: Stop container
        if: always()
        run: docker rm -f api
